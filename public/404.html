<!DOCTYPE html>
<html>
  <head>
    <title>Page not found</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        background: #02030d;
        color: #f5f7ff;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        text-align: center;
        padding: 20px;
      }
      h1 { font-size: 48px; margin: 0 0 10px; }
      p { font-size: 18px; color: #a4a9c8; margin: 0 0 20px; }
      a {
        display: inline-block;
        padding: 10px 20px;
        background: linear-gradient(135deg, #5b8dff, #ff4fbc);
        color: white;
        text-decoration: none;
        border-radius: 999px;
        font-weight: 600;
      }
      a:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <p>Page not found</p>
      <a href="/">← Back to home</a>

</html>
