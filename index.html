
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Matty Social · Sign In (Supabase)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/matty.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/supabase-init.js"></script>
</head>
<body>
  <main class="matty-shell">
    <div class="matty-shell-inner">
      <div class="matty-logo-row">
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="matty-logo-mark">M</div>
          <div class="matty-logo-text">
            <div class="matty-logo-name">Matty Social</div>
            <div class="matty-logo-sub">Supabase Neon Network</div>
          </div>
        </div>
        <div class="matty-hint-pill">
          <span class="matty-dot"></span>
          <span>Supabase Auth · Email</span>
        </div>
      </div>

      <h1 class="matty-title">Welcome back</h1>
      <p class="matty-subtitle">
        Sign in to your Matty creator space. Supabase manages your auth and profiles.
      </p>

      <form id="login-form" class="matty-form">
        <div>
          <label for="login-email">Email</label>
          <div class="matty-input-wrap">
            <span class="matty-input-icon">✉️</span>
            <input id="login-email" class="matty-input" type="email"
                   placeholder="you@example.com" required />
          </div>
        </div>

        <div>
          <label for="login-password">Password</label>
          <div class="matty-input-wrap">
            <span class="matty-input-icon">🔑</span>
            <input id="login-password" class="matty-input" type="password"
                   placeholder="••••••••" required />
          </div>
        </div>

        <div class="matty-row">
          <label class="matty-remember">
            <input id="remember-me" type="checkbox" />
            <span>Keep me signed in</span>
          </label>
          <a class="matty-link" href="./forgot.html">Forgot password?</a>
        </div>

        <button type="submit" class="matty-btn-primary" id="login-btn">
          <span>Sign In</span>
          <span style="font-size:14px;">↪</span>
        </button>

        <button type="button" class="matty-btn-secondary" onclick="window.location.href='./signup.html'">
          <span>New here?</span>
          <span>Create Matty account</span>
        </button>
      </form>

      <div id="login-status" class="matty-status"></div>

      <div class="matty-chip-row">
        <div class="matty-chip">
          <span class="matty-chip-dot"></span>
          <span>Supabase Auth</span>
        </div>
        <div class="matty-chip">
          <span class="matty-chip-dot"></span>
          <span>Profiles table</span>
        </div>
        <div class="matty-chip">
          <span class="matty-chip-dot"></span>
          <span>Neon mode · Matty v3</span>
        </div>
      </div>

      <div class="matty-footer">
        <span>Don’t have an account? <strong><a class="matty-link" href="./signup.html">Sign up</a></strong></span>
        <span style="opacity:0.7;">Matty × Supabase</span>
      </div>
    </div>
  </main>

  <script type="module">
    import { supabaseClient } from "./js/supabase-init.js";

    const form = document.getElementById("login-form");
    const statusEl = document.getElementById("login-status");
    const loginBtn = document.getElementById("login-btn");

    function setStatus(msg, type="") {
      statusEl.textContent = msg || "";
      statusEl.classList.remove("error","ok");
      if (type) statusEl.classList.add(type);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      setStatus("Signing in…");
      loginBtn.disabled = true;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        console.error(error);
        setStatus(error.message || "Login failed", "error");
      } else {
        setStatus("Signed in. Redirecting…", "ok");
        setTimeout(() => {
          window.location.href = "./dashboard.html";
        }, 600);
      }
      loginBtn.disabled = false;
    });
  </script>
</body>
</html>
